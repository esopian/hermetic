name: Bug report
description: Something in hermetic does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before pasting logs or output, remove anything secret: API keys, Tailscale keys (`tskey-…`), AWS account IDs you would rather not share. A security problem goes through [private reporting](https://github.com/esopian/hermetic/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`hermetic --version`, or the app's About window."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app (macOS)
        - CLI
        - Run from source (Linux / Intel Mac)
        - Phone app
        - An agent box (hermeticd, bootstrap)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The failing operation from `~/.hermetic/app.log` or `hermetic runs`; for a failure on a box, `hermetic agent history <name>`.
      render: text
