name: Site

# Reusable: `release.yml` calls this after a release publishes, with the tag
# that was just released. `workflow_dispatch` gives the same path a name a
# maintainer can call by hand — a docs fix or a re-deploy of a tag that failed
# to reach Cloudflare the first time, with no need to cut a new release.
on:
  workflow_call:
    inputs:
      ref:
        description: The release tag (vX.Y.Z) to build and deploy.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag (vX.Y.Z) to build and deploy.
        type: string
        required: true

concurrency:
  # One production deploy at a time; a re-dispatch waits for the one in
  # flight rather than racing it onto the same Cloudflare Pages project.
  group: site-production
  cancel-in-progress: false

# Nothing here writes to this repository — the one write this workflow makes
# is to Cloudflare, through the `deploy` job's own scoped token below.
permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gates the Cloudflare credentials behind a GitHub environment: only a
    # ref matching that environment's deployment-branch/tag policy may reach
    # the secrets below (see site/README.md "Deploy setup" for the one-time
    # policy setup, and its note on what workflow_dispatch resolves the ref
    # to).
    environment: site-production
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Installs the root workspace too: site/scripts/cli-reference.ts spawns
      # `bun ../packages/cli/src/main.ts`, so the CLI's own dependencies have
      # to be on disk. `./.github/actions/setup` already runs the root
      # `bun install --frozen-lockfile` — not duplicated here.
      - uses: ./.github/actions/setup

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      # The same script a maintainer runs by hand (site/scripts/deploy.ts):
      # preflight (clean tree, the release tag points at HEAD, the token can
      # reach the Pages project), check, build, deploy with the site's own
      # pinned wrangler, then verify over HTTP that both the new deployment and
      # the production URL serve this commit. It reads the commit from the
      # checkout (`git rev-parse HEAD`), never from `github.sha`, which on
      # workflow_dispatch names the default branch rather than the ref built.
      # Every input reaches it through env:, never through the shell text.
      - name: Check, build, deploy and verify
        working-directory: site
        run: bun scripts/deploy.ts --production --yes
        env:
          # Read by site/src/data/release.ts for the version badge and download
          # links, and by the deploy script, which refuses a tag that does not
          # point at the checked-out commit.
          HERMETIC_RELEASE_TAG: ${{ inputs.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
