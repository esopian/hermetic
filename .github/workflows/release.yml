name: Release

# Tag-triggered, not branch-triggered: `git tag v<version>` on master (after the
# version bump lands there) is what starts a release. See CONTRIBUTING.md
# "Cutting a release" for the full procedure this workflow is one half of.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing here writes to the repository except the one job that has to
# (publish, below) — its own permissions block carries the grant and the
# reason, same shape as ci.yml's default.
permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      # contents: write — publishes the GitHub Release and uploads packages/app/artifacts/*
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          hutch: true

      # A tag that does not match the version in package.json means someone
      # tagged the wrong commit, or forgot to bump the version first — fail
      # before anything is built, not after `gh release create` half-runs.
      - name: Assert the tag matches package.json version
        shell: bash
        run: |
          version=$(jq -r .version package.json)
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected ${expected})" >&2
            exit 1
          fi

      # A release is cut from master (CONTRIBUTING.md "Cutting a release"). A
      # tag pushed from any other branch — by hand, or from a stale checkout —
      # would otherwise publish whatever that branch holds. Asked of the API
      # rather than of git so the shallow checkout above can stay shallow:
      # "identical" or "behind" means the tagged commit is master or an
      # ancestor of it; "ahead" or "diverged" means it is not on master.
      - name: Assert the tagged commit is on master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)
          if [ "${status}" != "identical" ] && [ "${status}" != "behind" ]; then
            echo "tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on master (compare: ${status})" >&2
            exit 1
          fi

      # The check below ends in lint:cfn and lint:sh, which run cfn-lint and
      # shellcheck through `uvx` (pinned in scripts/lint-cfn.ts and
      # scripts/lint-sh.ts) — the same install ci.yml's lint jobs make.
      - name: Install uv (for cfn-lint and shellcheck)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # `bun run check`, step by step, with its `bun test` replaced by the two
      # shards ci.yml runs. A plain `bun test` gives every test Bun's default
      # 5s timeout and 20 in flight; the cli shard's compiled-CLI spawns are
      # CPU-bound, and on this runner v0.2.0's twelve slowest overran 5s
      # together. scripts/test-shard.ts owns each shard's concurrency and
      # timeout, so the release gate matches the one the commit already passed.
      - run: bun run typecheck
      - run: bun scripts/test-shard.ts cli
      - run: bun scripts/test-shard.ts non-cli
      - run: bun run lint:biome
      - run: bun run lint
      - run: bun run lint:cfn
      - run: bun run lint:sh
      # Headroom, not a fix: v0.1.4's and v0.1.5's "No space left on device"
      # came from the DMG's own mounted volume being sized by hdiutil's
      # estimator, not from the runner's disk (v0.1.5 failed with 110 GB
      # free) — `packages/app/hooks/post-package.ts` is what addresses that.
      # The macos-14 image still leaves only a few GB free once Xcode,
      # Android and .NET are on it, and this build writes a few hundred MB of
      # sidecars, so drop the toolchains it never touches and print what is
      # left.
      - name: Free runner disk
        shell: bash
        run: |
          df -h / | tail -1
          sudo rm -rf ~/Library/Android/sdk /usr/local/share/dotnet /Library/Frameworks/Mono.framework \
            ~/.rustup ~/.cargo /usr/local/lib/node_modules ~/Library/Developer/CoreSimulator/Caches
          df -h / | tail -1
      # Hutch signs with the identity ELECTROBUN_DEVELOPER_ID names, so the
      # Developer ID certificate has to sit in a keychain codesign searches: a
      # throwaway one, gone with the runner. An unsigned build is refused here
      # rather than published — quarantined, its ad-hoc launcher reads to
      # Gatekeeper as "damaged" and macOS offers only "Move to Trash".
      - name: Import the Developer ID certificate and notary key
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12}" ] || [ -z "${API_KEY_P8}" ]; then
            echo "signing secrets are not set (CONTRIBUTING.md \"Signing\"); refusing to build an unsigned release" >&2
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_pass=$(openssl rand -hex 16)
          security create-keychain -p "${keychain_pass}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_pass}" "${keychain}"
          printf '%s' "${CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_pass}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          (umask 077 && printf '%s' "${API_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8")
      # Setting ELECTROBUN_DEVELOPER_ID and ELECTROBUN_APPLEAPIKEY is what turns
      # `mac.codesign` and `mac.notarize` on (packages/app/electrobun.config.ts).
      - run: bun run app:build
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIKEYPATH: ${{ runner.temp }}/AuthKey.p8

      # What a downloader's Mac checks, asked of the DMG that is about to ship:
      # a valid Developer ID signature over the whole bundle, a stapled
      # notarisation ticket, and Gatekeeper's verdict.
      - name: Verify the DMG's app is signed and notarised
        shell: bash
        run: |
          set -euo pipefail
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" packages/app/artifacts/macos-arm64-Hermetic.dmg
          trap 'hdiutil detach "${mnt}" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "${mnt}/Hermetic.app"
          xcrun stapler validate "${mnt}/Hermetic.app"
          spctl --assess --type execute --verbose=2 "${mnt}/Hermetic.app"

      - name: Publish the GitHub Release
        env:
          # Scoped to this job by the `permissions` block above; every other
          # job in every other workflow keeps the read-only default.
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/app/artifacts/* --generate-notes

  # Deploys the marketing/docs site's landing page and download links against
  # the release that `publish` just created. A failed site deploy does not
  # un-publish the release — the release is the product, the site follows it
  # — so this is its own job rather than a step of `publish`; a docs-only
  # re-deploy later goes through `gh workflow run site.yml -f ref=<tag>`
  # instead of cutting a new release.
  site:
    name: site
    needs: publish
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
