# Build the iPhone app and upload it to App Store Connect: build (production
# profile, next build number) and submit. The upload then triggers
# testflight-distribute.yml, which adds the build to Alpha Users with
# RELEASE_NOTES.md's "What to test" as the tester notes and submits it for Beta
# App Review. Apple's approval is the only step left by hand.
#
# The split is the EAS free plan's: a `testflight` job given an EAS `build_id`
# needs a paid plan, one given an App Store Connect `asc_build_id` does not.
#
# Runs on a `mobile-v*` tag (`git tag mobile-v0.1.0-8 && git push origin
# mobile-v0.1.0-8`), or on demand: `bun run release:testflight` from mobile/.
# See RELEASING.md, "Automated TestFlight".
name: TestFlight

on:
  push:
    tags:
      - mobile-v*
  workflow_dispatch: {}

jobs:
  notes:
    # Fails the run before a build is spent when "What to test" is missing.
    name: Check What to Test
    steps:
      - uses: eas/checkout
      - run: |
          # A tag run checks out the repo; `workflow:run` uploads mobile/ alone.
          file="$(ls mobile/RELEASE_NOTES.md RELEASE_NOTES.md 2>/dev/null | head -n 1 || true)"
          notes="$(awk '/^## What to test/{on=1; next} /^## /{on=0} on' "${file:-RELEASE_NOTES.md}" | sed '/./,$!d')"
          if [ -z "$notes" ]; then
            echo "RELEASE_NOTES.md has no '## What to test' section" >&2
            exit 1
          fi

  build_ios:
    name: Build iOS
    type: build
    needs: [notes]
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload to App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
